[project]
name = "busvideo-server"
version = "0.1.1"
description = "Bus Video Distribution - garage server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "cryptography>=42,<46",
    "paramiko>=3.4",      # instalação da frota pela rede (busvideo_server.fleet)   # CA e certificado HTTPS da garagem (busvideo_server.tls); <46 = wheels prontas em todas as plataformas
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "static-ffmpeg>=2.7"]
windows = ["static-ffmpeg>=2.7"]   # ffprobe embutido: PC da garagem com Windows, sem instalar o ffmpeg

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["busvideo_server*"]

[tool.setuptools.package-data]
busvideo_server = ["web/templates/*.html", "web/static/*"]
