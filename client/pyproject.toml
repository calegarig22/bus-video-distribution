[project]
name = "busvideo-client"
version = "0.1.1"
description = "Bus Video Distribution - embedded bus terminal (player + sync agent)"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
